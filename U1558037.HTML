<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>U1558037 - 圖片互動展覽</title>

    <!-- 🔗 連結分離的 CSS 檔案 -->
    <link rel="stylesheet" href="U1558037.css">
</head>
<body>

    <header class="header">
        <h1>U1558037 圖片藝廊</h1>
        <p>（純 HTML + CSS 實現，完全無使用 JavaScript / Java）</p>
    </header>

    <main class="gallery-container">

        <!-- 圖片 1：放大 + 旋轉 (點擊前往 Google) -->
        <a href="https://www.google.com" target="_blank" rel="noopener noreferrer" class="img-card card-1">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/1015/400/300" alt="風景圖片 1">
            </div>
            <div class="caption">
                <h3>圖片 1：放大旋轉</h3>
                <p>點擊開啟 Google</p>
            </div>
        </a>

        <!-- 圖片 2：向上浮動 (點擊前往 維基百科) -->
        <a href="https://zh.wikipedia.org" target="_blank" rel="noopener noreferrer" class="img-card card-2">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/1018/400/300" alt="風景圖片 2">
            </div>
            <div class="caption">
                <h3>圖片 2：向上浮動</h3>
                <p>點擊開啟 維基百科</p>
            </div>
        </a>

        <!-- 圖片 3：左右搖擺 (點擊前往 YouTube) -->
        <a href="https://www.youtube.com" target="_blank" rel="noopener noreferrer" class="img-card card-3">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/1025/400/300" alt="動物圖片">
            </div>
            <div class="caption">
                <h3>圖片 3：左右搖擺</h3>
                <p>點擊開啟 YouTube</p>
            </div>
        </a>

        <!-- 圖片 4：脈衝跳動 (點擊前往 GitHub) -->
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="img-card card-4">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/1039/400/300" alt="瀑布圖片">
            </div>
            <div class="caption">
                <h3>圖片 4：心跳脈動</h3>
                <p>點擊開啟 GitHub</p>
            </div>
        </a>

        <!-- 圖片 5：3D 傾斜 (點擊前往 Apple) -->
        <a href="https://www.apple.com" target="_blank" rel="noopener noreferrer" class="img-card card-5">
            <div class="img-wrapper">
                <img src="https://picsum.photos/id/1043/400/300" alt="建築圖片">
            </div>
            <div class="caption">
                <h3>圖片 5：3D 視角傾斜</h3>
                <p>點擊開啟 Apple 官網</p>
            </div>
        </a>

    </main>

    <footer class="footer">
        <p>&copy; U1558037 個人網頁設計作品</p>
    </footer>

</body>
</html>
